name: Librarian CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run stdio smoke tests
        env:
          LIBRARIAN_REFINED_DIR: ./data-refined
        run: bun run smoke

      - name: Run HTTP smoke tests
        env:
          LIBRARIAN_REFINED_DIR: ./data-refined
          LIBRARIAN_PORT: "39001"
        run: |
          set -euo pipefail

          bun run start:http > /tmp/librarian-http.log 2>&1 &
          PID=$!

          cleanup() {
            kill "$PID" >/dev/null 2>&1 || true
            wait "$PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 25); do
            if curl -sSf "http://127.0.0.1:${LIBRARIAN_PORT}/health" >/dev/null; then
              READY=1
              break
            fi
            sleep 0.2
          done

          if [ "$READY" -ne 1 ]; then
            echo "HTTP server did not become ready in time"
            cat /tmp/librarian-http.log || true
            exit 1
          fi

          for ID in 1 2; do
            CODE=$(curl -s -o "/tmp/http-${ID}.txt" -w "%{http_code}" \
              -X POST "http://127.0.0.1:${LIBRARIAN_PORT}/mcp" \
              -H "accept: application/json, text/event-stream" \
              -H "content-type: application/json" \
              -d "{\"jsonrpc\":\"2.0\",\"id\":${ID},\"method\":\"tools/list\",\"params\":{}}")

            if [ "$CODE" != "200" ]; then
              echo "HTTP smoke request ${ID} failed with status ${CODE}"
              cat "/tmp/http-${ID}.txt" || true
              cat /tmp/librarian-http.log || true
              exit 1
            fi

            if ! grep -q '"tools"' "/tmp/http-${ID}.txt"; then
              echo "HTTP smoke request ${ID} response missing tools payload"
              cat "/tmp/http-${ID}.txt" || true
              cat /tmp/librarian-http.log || true
              exit 1
            fi
          done
