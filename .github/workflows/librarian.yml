name: Librarian CI

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  runtime-and-data-prep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Optional source sync from CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_BRANCH: data-raw
        run: |
          if [ -z "${CNB_TOKEN:-}" ]; then
            echo "CNB_TOKEN is not configured; skip external raw sync."
            exit 0
          fi
          git clone --depth 1 --branch "$CNB_BRANCH" "https://git:${CNB_TOKEN}@git.cnb.cool/ai-alchemy-factory/git-library.git" source

      - name: Optional standardize stage
        env:
          LIBRARIAN_ALLOW_MOCK_LLM: ${{ vars.LIBRARIAN_USE_MOCK_LLM || '0' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LIBRARIAN_RAW_DIR: ./source
          LIBRARIAN_REFINED_DIR: ./data-refined
        run: |
          if ! grep -q '"standardize"' package.json; then
            echo "standardize script not present in this runtime-first repo; skip."
            exit 0
          fi
          if [ ! -d source ]; then
            echo "source directory is missing; skip standardize stage."
            exit 0
          fi
          bun run standardize

      - name: Optional manifest stage
        env:
          LIBRARIAN_RAW_DIR: ./source
          LIBRARIAN_REFINED_DIR: ./data-refined
        run: |
          if ! grep -q '"manifest"' package.json; then
            echo "manifest script not present in this runtime-first repo; skip."
            exit 0
          fi
          bun run manifest

      - name: Run smoke tests
        env:
          LIBRARIAN_REFINED_DIR: ./data-refined
        run: bun run smoke

      - name: Run HTTP smoke tests
        env:
          LIBRARIAN_REFINED_DIR: ./data-refined
          LIBRARIAN_PORT: "39001"
        run: |
          set -euo pipefail

          bun run start:http > /tmp/librarian-http.log 2>&1 &
          PID=$!

          cleanup() {
            kill "$PID" >/dev/null 2>&1 || true
            wait "$PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 25); do
            if curl -sSf "http://127.0.0.1:${LIBRARIAN_PORT}/health" >/dev/null; then
              break
            fi
            sleep 0.2
          done

          for ID in 1 2; do
            CODE=$(curl -s -o "/tmp/http-${ID}.txt" -w "%{http_code}" \
              -X POST "http://127.0.0.1:${LIBRARIAN_PORT}/mcp" \
              -H "accept: application/json, text/event-stream" \
              -H "content-type: application/json" \
              -d "{\"jsonrpc\":\"2.0\",\"id\":${ID},\"method\":\"tools/list\",\"params\":{}}")

            if [ "$CODE" != "200" ]; then
              echo "HTTP smoke request ${ID} failed with status ${CODE}"
              cat "/tmp/http-${ID}.txt" || true
              cat /tmp/librarian-http.log || true
              exit 1
            fi

            if ! grep -q '"tools"' "/tmp/http-${ID}.txt"; then
              echo "HTTP smoke request ${ID} response missing tools payload"
              cat "/tmp/http-${ID}.txt" || true
              cat /tmp/librarian-http.log || true
              exit 1
            fi
          done

      - name: Upload refined artifacts when available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refined-data
          path: |
            data-refined/
            state/
          if-no-files-found: ignore
          retention-days: 7
